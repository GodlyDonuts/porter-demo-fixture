<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Porter Research Fixture — Start</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        background: #f4f5f7;
        color: #141519;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, rgb(255 255 255 / 92%), transparent 34rem),
          linear-gradient(145deg, #eef0f5, #dfe4ed);
      }

      main {
        width: min(38rem, calc(100vw - 4rem));
        padding: 4rem;
        border: 1px solid rgb(255 255 255 / 64%);
        border-radius: 2.25rem;
        background: rgb(255 255 255 / 56%);
        box-shadow: 0 2rem 6rem rgb(44 51 66 / 16%);
        backdrop-filter: blur(2rem) saturate(120%);
      }

      p {
        max-width: 32rem;
        margin: 0 0 1rem;
        color: #545965;
        font-size: 1.08rem;
        line-height: 1.55;
      }

      .eyebrow {
        margin-bottom: 1.4rem;
        color: #717784;
        font-size: 0.72rem;
        font-weight: 650;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 7vw, 4.7rem);
        font-weight: 570;
        letter-spacing: -0.065em;
        line-height: 0.96;
      }

      a {
        display: inline-block;
        margin-top: 1.7rem;
        padding: 0.95rem 1.25rem;
        border: 1px solid rgb(20 21 25 / 10%);
        border-radius: 999px;
        background: rgb(255 255 255 / 70%);
        color: inherit;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 0.6rem 1.8rem rgb(44 51 66 / 10%);
      }

      a:focus-visible {
        outline: 3px solid #1687ff;
        outline-offset: 4px;
      }

      .proof {
        margin-top: 2.2rem;
        color: #858a95;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 0.72rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #08090c;
          color: #f5f6f8;
        }

        body {
          background:
            radial-gradient(circle at 20% 10%, rgb(47 52 63 / 72%), transparent 34rem),
            linear-gradient(145deg, #11141a, #050609);
        }

        main {
          border-color: rgb(255 255 255 / 12%);
          background: rgb(19 22 28 / 68%);
          box-shadow: 0 2rem 6rem rgb(0 0 0 / 42%);
        }

        p { color: #aeb3bd; }
        .eyebrow { color: #888e99; }

        a {
          border-color: rgb(255 255 255 / 12%);
          background: rgb(255 255 255 / 8%);
        }

        .proof { color: #737985; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Porter · Build Week static research fixture</p>
      <h1>Trust must stay legible.</h1>
      <p>
        This page contains one ordinary, same-origin link. It has no scripts,
        forms, authentication, tracking, redirects, or download behavior.
      </p>
      <a href="../details/">Read the static details</a>
      <p class="proof">fixture: porter-research-v1 · start</p>
    </main>
  </body>
</html>
